name: Publish Package

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Skip when this version is already on npm
        id: guard
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PUBLISHED="$(npm view "haeram-spec-creator@${VERSION}" version 2>/dev/null || true)"
          if [ -n "$PUBLISHED" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "haeram-spec-creator@${VERSION} is already on npm — skipping publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "haeram-spec-creator@${VERSION} is not on npm yet — publishing."
          fi
      - if: steps.guard.outputs.publish == 'true'
        run: npm run release:check
      - if: steps.guard.outputs.publish == 'true'
        run: npm publish
